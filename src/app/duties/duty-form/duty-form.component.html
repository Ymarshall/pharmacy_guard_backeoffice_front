<div class="duty-form-container">
  <app-header></app-header>
  
  <div class="duty-form-content">
    <app-sidebar></app-sidebar>
    
    <main class="main-content">
      <div class="page-header">
        <h1>{{ isEditMode ? 'Modifier la garde' : 'Nouvelle garde' }}</h1>
        <button mat-button (click)="router.navigate(['/duties'])">
          <mat-icon>arrow_back</mat-icon>
          Retour
        </button>
      </div>

      @if (isLoading) {
        <div class="loading-container">
          <mat-spinner></mat-spinner>
        </div>
      } @else {
        <mat-card class="form-card">
          <mat-card-content>
            <form [formGroup]="dutyForm" (ngSubmit)="onSubmit()" class="duty-form">
              <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Nom</mat-label>
                  <input matInput formControlName="name" placeholder="Nom de la garde">
                </mat-form-field>
              </div>

              <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Description</mat-label>
                  <textarea matInput formControlName="description" rows="4" placeholder="Description de la garde"></textarea>
                </mat-form-field>
              </div>

              <div class="form-row">
                <div class="file-upload-section">
                  <h3>Fichier</h3>
                  <div class="file-upload-area">
                    @if (selectedFile || fileName) {
                      <div class="file-selected">
                        <mat-icon>attach_file</mat-icon>
                        <span class="file-name">{{ selectedFile ? selectedFile.name : fileName }}</span>
                        @if (selectedFile) {
                          <span class="file-size">({{ formatFileSize(selectedFile.size) }})</span>
                        }
                        <button mat-icon-button type="button" (click)="removeFile()" color="warn" title="Supprimer le fichier">
                          <mat-icon>close</mat-icon>
                        </button>
                      </div>
                    } @else {
                      <div class="file-upload-placeholder">
                        <input 
                          type="file" 
                          id="fileInput" 
                          (change)="onFileSelected($event)"
                          accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg,image/jpg"
                          class="file-input">
                        <label for="fileInput" class="file-input-label">
                          <mat-icon>cloud_upload</mat-icon>
                          <span>Cliquez pour sélectionner un fichier (PDF, JPEG uniquement)</span>
                          <span class="file-hint">ou glissez-déposez le fichier ici</span>
                        </label>
                      </div>
                    }
                  </div>
                </div>
              </div>

              <div class="form-actions">
                <button mat-button type="button" (click)="router.navigate(['/duties'])">
                  Annuler
                </button>
                <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting || dutyForm.invalid">
                  @if (isSubmitting) {
                    <mat-spinner diameter="20" class="button-spinner"></mat-spinner>
                    <span>Enregistrement...</span>
                  } @else {
                    {{ isEditMode ? 'Mettre à jour' : 'Créer' }}
                  }
                </button>
              </div>
            </form>
          </mat-card-content>
        </mat-card>
      }
    </main>
  </div>
</div>
