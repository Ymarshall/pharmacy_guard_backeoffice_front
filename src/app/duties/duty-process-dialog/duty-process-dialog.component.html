<h2 mat-dialog-title>Traiter le fichier</h2>

<mat-dialog-content>
  <form [formGroup]="processForm" class="process-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date de début</mat-label>
      <input matInput [matDatepicker]="startPicker" formControlName="startDate" placeholder="Sélectionner une date">
      <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
      @if (processForm.get('startDate')?.invalid && processForm.get('startDate')?.touched) {
        <mat-error>La date de début est requise</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date de fin</mat-label>
      <input matInput [matDatepicker]="endPicker" formControlName="endDate" placeholder="Sélectionner une date">
      <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
      @if (processForm.get('endDate')?.invalid && processForm.get('endDate')?.touched) {
        <mat-error>La date de fin est requise</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="processForm.invalid">
    Traiter
  </button>
</mat-dialog-actions>
