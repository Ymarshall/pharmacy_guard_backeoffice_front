<div class="assurance-form-container">
  <app-header></app-header>
  
  <div class="assurance-form-content">
    <app-sidebar></app-sidebar>
    
    <main class="main-content">
      <div class="page-header">
        <h1>{{ isEditMode ? 'Modifier l\'assurance' : 'Nouvelle assurance' }}</h1>
        <button mat-button (click)="router.navigate(['/assurances'])">
          <mat-icon>arrow_back</mat-icon>
          Retour
        </button>
      </div>

      @if (isLoading) {
        <div class="loading-container">
          <mat-spinner></mat-spinner>
        </div>
      } @else {
        <mat-card class="form-card">
          <mat-card-content>
            <form [formGroup]="assuranceForm" (ngSubmit)="onSubmit()" class="assurance-form">
              <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Nom de l'assurance *</mat-label>
                  <input matInput formControlName="name" placeholder="CNaPS">
                  @if (assuranceForm.get('name')?.invalid && assuranceForm.get('name')?.touched) {
                    <mat-error>{{ getErrorMessage('name') }}</mat-error>
                  }
                </mat-form-field>
              </div>

              <div class="form-row">
                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Description</mat-label>
                  <textarea matInput formControlName="description" rows="4" placeholder="Caisse Nationale de Prévoyance Sociale"></textarea>
                </mat-form-field>
              </div>

              <div class="form-actions">
                <button mat-button type="button" (click)="router.navigate(['/assurances'])">
                  Annuler
                </button>
                <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting || assuranceForm.invalid">
                  @if (isSubmitting) {
                    <mat-spinner diameter="20" class="button-spinner"></mat-spinner>
                    <span>Enregistrement...</span>
                  } @else {
                    {{ isEditMode ? 'Mettre à jour' : 'Créer' }}
                  }
                </button>
              </div>
            </form>
          </mat-card-content>
        </mat-card>
      }
    </main>
  </div>
</div>
